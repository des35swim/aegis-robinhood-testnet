<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Aegis target governance architecture</title>
  <desc id="desc">A target-state diagram showing a financial AI agent sending a structured proposal into the Aegis governance boundary before any action reaches a wallet, Robinhood Chain Testnet, or another financial system.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4b91d1"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e58a37"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}.title{font-size:28px;font-weight:700;fill:#172b3a}.sub{font-size:14px;fill:#607585}.zone{font-size:12px;font-weight:700;letter-spacing:1px}.boxTitle{font-size:15px;font-weight:700}.boxSub{font-size:12px}.stepTitle{font-size:14px;font-weight:700}.stepSub{font-size:12px}.edgeLabel{font-size:11px;font-weight:700}
    </style>
  </defs>
  <rect width="1400" height="820" fill="#f7f9fc"/>
  <text class="title" x="55" y="66">Aegis target governance architecture</text>
  <text class="sub" x="57" y="94">Target state · not deployed by the current proof of concept</text>

  <rect x="45" y="145" width="330" height="500" rx="20" fill="#fff" stroke="#afc2ce" stroke-width="2"/>
  <rect x="45" y="145" width="330" height="48" rx="20" fill="#edf3f7"/>
  <rect x="45" y="173" width="330" height="20" fill="#edf3f7"/>
  <text class="zone" x="72" y="175" fill="#496171">AGENT ENVIRONMENT</text>

  <rect x="435" y="120" width="520" height="550" rx="20" fill="#f7fcfe" stroke="#47aec7" stroke-width="3"/>
  <rect x="435" y="120" width="520" height="48" rx="20" fill="#dff7fc"/>
  <rect x="435" y="148" width="520" height="20" fill="#dff7fc"/>
  <text class="zone" x="462" y="151" fill="#17586a">AEGIS GOVERNANCE BOUNDARY</text>

  <rect x="1015" y="145" width="330" height="500" rx="20" fill="#fff" stroke="#e4b875" stroke-width="2"/>
  <rect x="1015" y="145" width="330" height="48" rx="20" fill="#fff6ea"/>
  <rect x="1015" y="173" width="330" height="20" fill="#fff6ea"/>
  <text class="zone" x="1042" y="175" fill="#805922">EXECUTION TARGETS</text>

  <rect x="85" y="215" width="250" height="86" rx="13" fill="#172b3a" stroke="#315466" stroke-width="2"/>
  <text class="boxTitle" x="210" y="250" text-anchor="middle" fill="#f1fafd">Amazon Bedrock AgentCore</text>
  <text class="boxSub" x="210" y="274" text-anchor="middle" fill="#9ab0bb">Target runtime and gateway</text>
  <rect x="85" y="345" width="250" height="82" rx="13" fill="#eaf4f8" stroke="#6ea8b9" stroke-width="2"/>
  <text class="boxTitle" x="210" y="378" text-anchor="middle" fill="#173f4d">Financial AI agent</text>
  <text class="boxSub" x="210" y="402" text-anchor="middle" fill="#647987">Researches · reasons · proposes</text>
  <rect x="92" y="515" width="236" height="34" rx="17" fill="#fdecef" stroke="#d97c89"/>
  <text x="210" y="537" text-anchor="middle" font-family="Arial" font-size="10" font-weight="700" fill="#9b3444">NO DIRECT WALLET OR FINANCIAL ACCESS</text>

  <g fill="#fff" stroke="#65bcd0" stroke-width="2">
    <rect x="485" y="185" width="420" height="66" rx="11"/><rect x="485" y="273" width="420" height="66" rx="11"/><rect x="485" y="537" width="420" height="66" rx="11"/>
  </g>
  <rect x="485" y="361" width="420" height="66" rx="11" fill="#e9faf3" stroke="#57b78b" stroke-width="2"/>
  <rect x="485" y="449" width="420" height="66" rx="11" fill="#fff8e7" stroke="#dab761" stroke-width="2"/>
  <g fill="#173f4d">
    <text class="stepTitle" x="505" y="212">1 · Trusted context</text><text class="stepSub" x="505" y="234" fill="#647987">Actor · tenant · session · authority</text>
    <text class="stepTitle" x="505" y="300">2 · Canonical proposal</text><text class="stepSub" x="505" y="322" fill="#647987">Normalize the requested action and terms</text>
    <text class="stepTitle" x="505" y="388" fill="#175c41">3 · Deterministic policy</text><text class="stepSub" x="505" y="410" fill="#527a67">Allow · deny · require human approval</text>
    <text class="stepTitle" x="505" y="476" fill="#73591c">4 · Human decision</text><text class="stepSub" x="505" y="498" fill="#806f47">Approval bound to the exact proposal</text>
    <text class="stepTitle" x="505" y="564">5 · Controlled execution</text><text class="stepSub" x="505" y="586" fill="#647987">Scoped adapter · expiry · replay protection</text>
  </g>
  <rect x="445" y="630" width="500" height="34" rx="17" fill="#eaf6fa" stroke="#62afc5"/>
  <text x="695" y="652" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#173f4d">Governance evidence: proposal + policy result + human decision + execution outcome</text>

  <g fill="#fff9f0" stroke="#e2b875" stroke-width="2">
    <rect x="1055" y="220" width="250" height="80" rx="13"/><rect x="1055" y="345" width="250" height="80" rx="13"/><rect x="1055" y="470" width="250" height="80" rx="13" stroke-dasharray="7 5"/>
  </g>
  <g text-anchor="middle" fill="#563b19">
    <text class="boxTitle" x="1180" y="252">Robinhood Chain Testnet</text><text class="boxSub" x="1180" y="276" fill="#806b4c">Reference adapter</text>
    <text class="boxTitle" x="1180" y="377">User-controlled wallets</text><text class="boxSub" x="1180" y="401" fill="#806b4c">Signing remains outside the agent</text>
    <text class="boxTitle" x="1180" y="502">Future financial APIs</text><text class="boxSub" x="1180" y="526" fill="#806b4c">Exchanges · custodians · payments</text>
  </g>

  <path d="M335 386 H420 Q445 386 445 306 H480" fill="none" stroke="#4b91d1" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <rect x="349" y="330" width="118" height="25" rx="6" fill="#f7f9fc"/><text class="edgeLabel" x="408" y="347" text-anchor="middle" fill="#295c88">Structured proposal</text>
  <path d="M905 570 H975 Q995 570 995 260 H1050" fill="none" stroke="#e58a37" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <rect x="930" y="392" width="126" height="25" rx="6" fill="#f7f9fc"/><text class="edgeLabel" x="993" y="409" text-anchor="middle" fill="#94551d">Authorized action</text>

  <rect x="230" y="710" width="940" height="60" rx="15" fill="#172b3a" stroke="#f0a23a" stroke-width="2"/>
  <text x="700" y="746" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#f8fafb">AWS FOUNDATION · IAM least privilege · CloudWatch observability · CloudTrail AWS activity</text>
  <path d="M695 670 V706" stroke="#899ba6" stroke-width="2" stroke-dasharray="7 5"/>
</svg>
